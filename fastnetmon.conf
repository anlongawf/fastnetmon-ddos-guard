###############################################################################
# FastNetMon Community - Cấu hình tối ưu cho Game Server Hosting
# Mục tiêu: Minecraft (TCP/UDP 25565-25600) + GTA FiveM (UDP/TCP 30120+)
# Môi trường: Ubuntu/Debian + Pterodactyl Wings + Docker
# Phiên bản: FastNetMon Community >= 1.2.x
###############################################################################

###############################################################################
# 1. INTERFACE MẠNG - Chỉ định card mạng cần theo dõi
###############################################################################

# Thay eth0 bằng tên interface thực tế của bạn (ip link show để kiểm tra)
interfaces = eth0

# Nếu có nhiều interface (bonding, VLAN):
# interfaces = eth0,eth1

###############################################################################
# 2. ENGINE BẮT GÓI TIN - Dùng AF_PACKET (tối ưu cho Linux game server)
###############################################################################

# AF_PACKET: Không cần driver đặc biệt, hoạt động tốt với Docker bridge
# Thay thế cho PF_RING (cần license) hay DPDK (cần NIC đặc biệt)
mirror_afpacket = on

# Kích hoạt capture traffic thực (không chỉ sample)
process_incoming_traffic = on
process_outgoing_traffic = on

# Số luồng xử lý packet. Đặt bằng số CPU core (kiểm tra: nproc)
# Với VPS 4 core:
netflow_workers = 4

# Kích thước ring buffer AF_PACKET (MB). Tăng nếu bị drop packet
# Với 10Gbps uplink: đặt 512-1024
afpacket_ring_buffer_size = 67108864   # 64 MB, đủ cho server hosting nhỏ

###############################################################################
# 3. NGƯỠNG PHÁT HIỆN - Tinh chỉnh cho game traffic thực tế
###############################################################################
# GIẢI THÍCH NGƯỠNG:
# - Minecraft: 1 player tạo ~50-200 packets/s, server 50 slots = ~10.000 pps bình thường
# - FiveM: bandwidth-heavy hơn, 32 players = ~15.000-30.000 pps bình thường
# - UDP Flood DDoS: thường bắt đầu từ 100.000+ pps / vài Gbps
#
# Nguyên tắc: ngưỡng phải đủ cao để không false-positive khi full slot,
#             nhưng đủ nhạy để bắt DDoS sớm.

# --- Ngưỡng PPS (Packets Per Second) ---
# 50.000 pps = vượt xa traffic game bình thường, DDoS cấp nhẹ
threshold_pps = 50000

# --- Ngưỡng Mbps ---
# 500 Mbps = rất khó là game traffic bình thường
threshold_mbps = 500

# --- Ngưỡng Flows (số kết nối đồng thời bất thường) ---
threshold_flows = 3500

# Ngưỡng áp dụng theo chiều incoming (bảo vệ server bị tấn công vào)
ban_for_pps = on
ban_for_bandwidth = on
ban_for_flows = on

###############################################################################
# 4. THỜI GIAN BAN TỰ ĐỘNG UNBAN
###############################################################################

# Thời gian cách ly (giây) trước khi tự động unban
# 900 giây = 15 phút. Khuyến nghị cho game server để tránh quá ngắn/dài.
ban_time = 900

###############################################################################
# 5. NOTIFY SCRIPT - Tích hợp script xử lý tự động của chúng ta
###############################################################################

# Bật tính năng gọi script ngoài khi ban/unban
notify_script_enabled = on

# Đường dẫn tuyệt đối đến script của chúng ta
notify_script_path = /opt/fastnetmon_guard/notify_script.sh

# FastNetMon sẽ pipe traffic dump qua stdin vào script
# Đảm bảo script có quyền thực thi: chmod +x notify_script.sh

# Truyền chi tiết tấn công kèm theo
# (Có thể không có trong Community, nhưng để sẵn)
notify_script_pass_details = on

###############################################################################
# 6. CẤU HÌNH MẠNG VÀ SUBNET
###############################################################################

# Khai báo dải IP public của node cần bảo vệ
# THAY ĐỔI theo IP thực tế của máy chủ bạn
networks_list = /etc/fastnetmon_networks_list

# File /etc/fastnetmon_networks_list chứa (mỗi dòng 1 CIDR):
# 203.0.113.0/24
# Hoặc chỉ 1 IP: 203.0.113.10/32

###############################################################################
# 7. CẤU HÌNH ĐẦU RA / LOG
###############################################################################

# Log level: error, warning, info, debug
logging_level = info

# File log chính của FastNetMon
logging_file = /var/log/fastnetmon.log

# Ghi traffic dump khi phát hiện tấn công (để script đọc)
enable_ban_details_messages = on

# Số lượng packet sample tối đa ghi vào dump (tránh file quá lớn)
ban_details_records_count = 500

# Thư mục lưu dump file tạm (script sẽ đọc từ đây nếu stdin không có)
# Đây là thư mục FastNetMon tự tạo dump
# Mặc định FastNetMon ghi vào /tmp/fastnetmon_<IP>.dump

###############################################################################
# 8. BLACKHOLE / BGP (KHÔNG DÙNG - Chúng ta dùng iptables thay thế)
###############################################################################

# QUAN TRỌNG: Tắt BGP blackhole vì ta dùng iptables ngắt port qua notify_script
gobgp_enabled = off
exabgp_enabled = off

###############################################################################
# 9. SAMPLING VÀ HIỆU NĂNG
###############################################################################

# Tần suất cập nhật thống kê traffic (giây)
# Đặt thấp để phát hiện nhanh, nhưng tiêu tốn CPU hơn
average_calculation_time = 5

# Số giây tích lũy dữ liệu trước khi tính trung bình
# 30 giây: cân bằng giữa phát hiện nhanh và tránh false-positive
ban_calculation_time = 30

# Kích hoạt per-protocol stats (giúp phân biệt UDP flood vs SYN flood)
enable_connection_tracking = on

###############################################################################
# 10. WHITELIST (Không bao giờ ban những IP này)
###############################################################################

# File whitelist IP (mỗi dòng 1 IP hoặc CIDR)
# Thêm IP của bạn, monitoring server, trusted clients
white_list_path = /etc/fastnetmon_whitelist

# Nội dung file /etc/fastnetmon_whitelist ví dụ:
# 127.0.0.1/32       # localhost
# 10.0.0.0/8         # internal network
# 192.168.0.0/16     # private range

###############################################################################
# 11. REDIS / MONGODB (Tùy chọn - lưu lịch sử tấn công)
###############################################################################

# Lưu thống kê vào Redis (cần cài redis-server)
redis_enabled = off
# redis_host = 127.0.0.1
# redis_port = 6379

###############################################################################
# CHÚ THÍCH NGƯỠNG THEO TỪNG LOẠI GAME
###############################################################################
# Game       | Bình thường (50 players) | Ngưỡng cảnh báo | DDoS điển hình
# -----------|--------------------------|-----------------|----------------
# Minecraft  | 5.000 - 15.000 pps       | 50.000 pps      | 100k-1M pps
# FiveM      | 10.000 - 30.000 pps      | 50.000 pps      | 200k-2M pps
# Rust       | 8.000 - 20.000 pps       | 50.000 pps      | 500k+ pps
#
# Bandwidth:
# Minecraft  | 10-50 Mbps               | 200 Mbps        | 1-100 Gbps
# FiveM      | 20-80 Mbps               | 300 Mbps        | 1-100 Gbps
#
# => Ngưỡng 50.000 pps / 500 Mbps là an toàn cho đa số game server hosting
###############################################################################
